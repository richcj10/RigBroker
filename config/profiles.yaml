# RigBroker example configuration. Frequencies and callsigns are PLACEHOLDERS.
# Validate with:  rigbroker --check-config --config config/profiles.yaml
radios:
  vu:
    name: ID-4100A
    # Digirig on this Pi: CP2102N serial (CI-V 0x9A @ 9600 baud, PTT = RTS) and C-Media
    # audio (ALSA "Device"). rigctld itself runs from deploy/rigctld-vu.service.
    rigctld: 127.0.0.1:4542
    rigctld_service: rigctld-vu        # restarted during fault recovery
    # USB interface checks, so the log says WHICH link failed (Digi-Rig gone vs rigctld
    # down vs radio not answering). Read-only: never opens the serial port.
    interface: {name: Digi-Rig, usb_serial: 9846aeb62cc6ef1188be69527a5e3baa, audio_card: Device}
    # station position from the ID-4100's GPS (CI-V 0x23 0x00, read-only, kept in memory only)
    gps: {civ_address: 0x9A, every_minutes: 10}
    default_profile: aprs              # the default profile is always preemptible by a lease
    winlink_profile: winlink_pkt       # used by the "Start Winlink session" button
    # power = RFPOWER 0..1, set on every tune and read back. The ID-4100 clamps anything
    # below 0.165 (raw 42/255) to 0.165 = L (low). 0.50 = M (mid, confirmed on the display).
    # TX profiles run at M after the low-power dummy-load and RX tests (2026-11-10).
    # volume = AF 0..1: RX audio to the Digi-Rig comes from the speaker jack, so it follows
    # the volume; 0.12 + Digi-Rig capture 29 gives Direwolf ~50. Set on every tune.
    profiles:
      # without --allow-tx, APRS runs the receive-only direwolf@aprs-rx (no PTT line at all)
      aprs:        {freq: 144390000, mode: FM, power: 0.5, squelch: 0.15, volume: 0.12, service: direwolf@aprs,
                    rx_service: direwolf@aprs-rx, preemptible: true, transmits: true}
      # Winlink sessions for Winlink Express on the PC (remote client, no job on the Pi):
      # the broker tunes + verifies, starts the modem, and holds the radio until Release
      # or max_minutes. Winlink Express connects over the LAN:
      #   packet:  KISS TCP  192.168.5.157:8010   (direwolf@pkt)
      #   VARA FM: TCP       192.168.5.157:8300   (vara-fm; PTT via virtual COM -> rigctld)
      # winlink_pkt tunes to the gateway picked in the Winlink gateways panel / planner.
      # The ID-4100 is dual band: 2 m and 70 cm packet gateways are both allowed.
      # squelch 0.30: at 0.15, 70 cm noise held the squelch open (clear-channel timeout).
      winlink_pkt: {freq: 145050000, mode: FM, power: 0.5, squelch: 0.30, volume: 0.12, service: direwolf@pkt,
                    winlink_mode: packet, freq_ranges: [[144000000, 148000000], [420000000, 450000000]],
                    max_minutes: 30, transmits: true}
      vara_fm:     {freq: 145090000, mode: FM, power: 0.5, squelch: 0.15, volume: 0.12, service: vara-fm, max_minutes: 30, transmits: true}
      monitor:     {freq: 147240000, mode: FM, squelch: 0.15, volume: 0.12, service: audio-stream, max_minutes: 60, transmits: false}
      # No "off" profile: Hamlib's ID-4100 driver can't power the radio off over CI-V
      # (set_powerstat -> RPRT -11). For a radio that can, add:
      #   "off": {service: null, rig_power: "off", transmits: false}   # quote off/on/yes/no!
    hooks:
      usb_power_cycle: null            # e.g. "uhubctl -l 1-1 -p 2 -a cycle"
      rig_power_cut: null              # e.g. a relay script; run on stuck TX
  hf:
    name: FT-891
    rigctld: 127.0.0.1:4543
    default_profile: "off"
    profiles: {}                       # empty = not managed yet

safety:
  tx_holdoff_s: 2
  clear_channel_timeout_s: 30
  stuck_tx_s: 90

mqtt: {host: 127.0.0.1, port: 1883, base_topic: rigbroker, discovery_prefix: homeassistant}

api: {host: 0.0.0.0, port: 8080}     # web UI + REST + WebSocket (firewalled to the LAN)

# APRS station: messages to `callsign` are acknowledged; `other_calls` are shown only.
# Transmits (acks, your messages) only while direwolf@aprs runs on the radio and the
# broker was started with --allow-tx.
aprs:
  callsign: KY4WL-5
  other_calls: [KY4WL]
  radio: vu
  kiss: 127.0.0.1:8001          # Direwolf KISS (firewalled: never reachable from the LAN)
  msg_path: [WIDE1-1, WIDE2-1]
  msg_retries: 5                # 30 s, 60 s, 120 s, ... then "failed"
  msg_retry_s: 30

# Direwolf configs are GENERATED by the broker into conf_dir (aprs.conf, aprs-rx.conf,
# pkt.conf). Edit these in the web UI (saved to settings_file); `defaults` is the start.
direwolf:
  conf_dir: ~/.local/state/rigbroker/direwolf
  settings_file: ~/.local/state/rigbroker/direwolf-settings.json
  defaults:
    adevice: "plughw:CARD=Device,DEV=0"   # Digirig (C-Media); check with `aplay -l`
    rigctld_port: 4542                    # PTT via rigctld, which owns the serial port
    beacon: false                         # needs lat/lon; min interval 10 min
    beacon_every_min: 30
    symbol: "/-"
    comment: "RigBroker"
    digipeater: "off"                     # off | fill-in (WIDE1-1) | wide
    igate: false                          # passcode computed from the callsign

# Access control: anyone may VIEW; anything that changes the radio needs the station
# password (browser) or an API token (Home Assistant / rigbrokerctl).
# Set the password on the Pi:  .venv/bin/rigbroker-admin passwd
security:
  auth_file: ~/.config/rigbroker/auth.json   # scrypt hash + token hashes, mode 0600
  public_view: true                          # false = login needed to see status too
  session_hours: 12
  max_failures: 5                            # failed logins before a lockout
  lockout_minutes: 5

# Winlink gateway planner. Favorites are tried first, then by measured success rate,
# then by distance (needs grid), with day/night band preference for HF.
# Favorites/blocklist/added gateways set from the web UI are saved in state_file
# (mock mode uses state_file + ".mock" so fake attempts never pollute real history).
winlink:
  grid: null                         # your Maidenhead locator, e.g. EM85ab
  max_attempts: 3                    # gateways tried per Winlink check
  attempt_minutes: 4                 # per-gateway limit (lease max_minutes still applies)
  state_file: ~/.local/state/rigbroker/winlink.json
  band_preference: {day: [20m, 30m, 40m], night: [80m, 40m, 30m]}   # HF only
  # Add your local gateways in the web UI (Station > Winlink gateways > + Add gateway):
  # they are saved in state_file on the Pi, not in this (public) file. Find them with
  # Winlink Express > Packet Winlink > Channel Selection (sorted by distance).
  gateways: []
