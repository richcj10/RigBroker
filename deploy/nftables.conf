#!/usr/sbin/nft -f
# HamControl firewall: only SSH and the RigBroker UI, only from the LAN.
# Everything else inbound is dropped - in particular Direwolf AGW/APRS-KISS (8000/8001)
# and rigctld (4532-4543), which can key the transmitter and must never be reachable
# from the network. The Winlink modem ports are open to WINLINK_PC_MAC only. Outbound
# is unrestricted.
#
# Install: sudo cp deploy/nftables.conf /etc/nftables.conf && sudo systemctl enable --now nftables
flush ruleset

define LAN4 = 192.168.5.0/24
# The ONE computer allowed to drive Winlink sessions (Winlink Express), matched by its
# network card's MAC address so a new DHCP lease doesn't lock it out (same LAN segment
# only). Find it on the Pi:  ip neigh   (or on Windows: Get-NetAdapter).
# These ports can key the transmitter, and only answer while RigBroker has started a
# Winlink session.
define WINLINK_PC_MAC = 98:b7:85:23:25:57

table inet hamcontrol {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        meta l4proto icmp accept                    # ping, PMTU
        meta l4proto ipv6-icmp accept               # IPv6 neighbour discovery (required)
        udp sport 67 udp dport 68 accept            # DHCPv4 replies
        udp dport 546 ip6 saddr fe80::/10 accept    # DHCPv6 replies

        ip saddr $LAN4 tcp dport { 22, 8080 } accept
        ip6 saddr fe80::/10 tcp dport { 22, 8080 } accept
        ip saddr $LAN4 udp dport 5353 accept        # mDNS: HamControl.local
        ip6 saddr fe80::/10 udp dport 5353 accept

        # Winlink Express on the PC: packet KISS (direwolf@pkt) + VARA FM command/data
        ip saddr $LAN4 ether saddr $WINLINK_PC_MAC tcp dport { 8010, 8300, 8301 } accept

        limit rate 6/minute log prefix "hamcontrol-fw drop: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
