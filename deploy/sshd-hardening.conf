# /etc/ssh/sshd_config.d/10-hamcontrol-hardening.conf
# Keys only, no root, no X11. sshd uses the FIRST value it sees, and files in
# sshd_config.d are read in name order, so "10-" wins over e.g. 50-cloud-init.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
MaxAuthTries 3
AllowUsers ham
